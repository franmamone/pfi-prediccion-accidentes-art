[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfi-prediccion"
version = "0.1.0"
description = "Pipeline ML para predicción de accidentes laborales en ART"
readme = "python/README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "sqlalchemy>=2.0.0",
    "pyodbc>=5.0.0",
    "python-dotenv>=1.0.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]
